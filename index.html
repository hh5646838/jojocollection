<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoJoCollection - 低频里的乐队手札</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 首页黑胶唱片区 -->
    <section id="vinyl-section" class="vinyl-section">
        <div class="vinyl-container">
            <div class="vinyl-wrapper">
                <div class="vinyl-record" id="vinyl-record">
                    <div class="vinyl-grooves"></div>
                    <div class="vinyl-center">
                        <img id="vinyl-cover" src="" alt="Album Cover" class="vinyl-cover">
                    </div>
                </div>
            </div>
            <div class="vinyl-info">
                <h2 id="track-title" class="track-title">Loading...</h2>
                <p id="track-artist" class="track-artist">Loading...</p>
                <button id="play-btn" class="play-btn">
                    <span class="play-icon">▶</span>
                    <span class="pause-icon">⏸</span>
                </button>
            </div>
        </div>
        <div class="album-covers">
            <h1 class="collection-title">JoJoCollection</h1>
            <div class="album-grid" id="album-grid">
                <!-- 专辑封面将通过 JS 动态生成 -->
            </div>
        </div>
    </section>

    <!-- 文章合集分类区 - Bento 布局 -->
    <section id="collections" class="collections-section">
        <h2 class="section-title">文章合集</h2>
        <div class="bento-grid" id="bento-grid">
            <!-- Bento 模块将通过 JS 动态生成 -->
        </div>
    </section>

    <!-- 单篇文章时间流区 -->
    <section id="timeline" class="timeline-section">
        <div class="timeline-header">
            <h2 class="section-title">文章时间流</h2>
            <div class="sort-controls">
                <button id="sort-asc" class="sort-btn active">正序 ↑</button>
                <button id="sort-desc" class="sort-btn">倒序 ↓</button>
            </div>
        </div>
        <div class="timeline-list" id="timeline-list">
            <!-- 时间流文章将通过 JS 动态生成 -->
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <p>Bass in the dark. Stories in the groove.</p>
    </footer>

    <!-- 隐藏的音频元素 -->
    <audio id="audio-player" preload="auto"></audio>

    <!-- 专辑列表模态框 -->
    <div id="albums-modal" class="albums-modal">
        <div class="albums-modal-content">
            <button class="albums-modal-close">&times;</button>
            <div class="albums-modal-header">
                <h1 class="albums-modal-title">更多专辑</h1>
                <p class="albums-modal-subtitle">探索更多音乐作品</p>
            </div>
            <div class="albums-modal-grid" id="albums-modal-grid">
                <!-- 专辑卡片将通过 JS 动态生成 -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // 全局数据存储
        let config = {};
        let postsData = {};
        let currentTrack = null;
        let isPlaying = false;
        let sortAscending = true;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            loadPosts();
            handleHashScroll();
        });

        // 加载配置文件
        async function loadConfig() {
            try {
                const response = await fetch('posts.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                config = data.config || {};
                console.log('Config loaded successfully:', config);
                initVinylPlayer();
            } catch (error) {
                console.error('Error loading config:', error);
                const vinylInfo = document.querySelector('.vinyl-info');
                if (vinylInfo) {
                    vinylInfo.innerHTML = '<p style="color: #ff6b6b;">加载配置失败，请检查 posts.json 文件</p>';
                }
            }
        }

        // 加载文章数据
        async function loadPosts() {
            try {
                const response = await fetch('posts.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                postsData = data;
                console.log('Posts loaded successfully:', postsData);
                initCollections();
                initTimeline();
            } catch (error) {
                console.error('Error loading posts:', error);
                const bentoGrid = document.getElementById('bento-grid');
                const timelineList = document.getElementById('timeline-list');
                if (bentoGrid) {
                    bentoGrid.innerHTML = '<p style="color: #ff6b6b; padding: 2rem;">加载文章数据失败，请检查 posts.json 文件</p>';
                }
                if (timelineList) {
                    timelineList.innerHTML = '<p style="color: #ff6b6b; padding: 2rem;">加载文章数据失败，请检查 posts.json 文件</p>';
                }
            }
        }

        // 初始化黑胶播放器
        function initVinylPlayer() {
            if (!config.vinyl) return;
            
            const albumGrid = document.getElementById('album-grid');
            if (!albumGrid) return;
            
            const tracks = config.vinyl.tracks;
            const defaultTrackId = config.vinyl.defaultTrackId;
            
            // 生成专辑封面网格
            albumGrid.innerHTML = '';
            
            tracks.forEach((track, index) => {
                const albumItem = document.createElement('div');
                albumItem.className = 'album-item';
                if (track.id === defaultTrackId) {
                    albumItem.classList.add('active');
                }
                
                const img = document.createElement('img');
                img.src = track.cover;
                img.alt = track.title;
                
                albumItem.appendChild(img);
                albumItem.addEventListener('click', () => playTrack(track.id));
                albumGrid.appendChild(albumItem);
                
                // 在第6张专辑右下角添加"更多曲目"按钮
                if (index === tracks.length - 1) {
                    const moreTracksBtn = document.createElement('div');
                    moreTracksBtn.className = 'more-tracks-button';
                    moreTracksBtn.textContent = '更多曲目';
                    moreTracksBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showAlbumsModal();
                    });
                    albumItem.appendChild(moreTracksBtn);
                }
            });
            
            // 加载默认曲目
            playTrack(defaultTrackId);
            
            // 播放按钮事件
            const playBtn = document.getElementById('play-btn');
            if (playBtn) {
                playBtn.addEventListener('click', togglePlay);
            }
            
            // 音频播放结束事件
            const audioPlayer = document.getElementById('audio-player');
            if (audioPlayer) {
                audioPlayer.addEventListener('ended', () => {
                    const playBtn = document.getElementById('play-btn');
                    const vinylRecord = document.getElementById('vinyl-record');
                    if (playBtn) playBtn.classList.remove('playing');
                    if (vinylRecord) vinylRecord.classList.remove('playing');
                    isPlaying = false;
                });
            }
        }

        // 播放指定曲目
        function playTrack(trackId) {
            if (!config.vinyl) return;
            
            const track = config.vinyl.tracks.find(t => t.id === trackId);
            if (!track) return;
            
            currentTrack = track;
            
            // 更新黑胶中心图片
            const vinylCover = document.getElementById('vinyl-cover');
            if (vinylCover) vinylCover.src = track.cover;
            
            // 更新曲目信息
            const trackTitle = document.getElementById('track-title');
            const trackArtist = document.getElementById('track-artist');
            if (trackTitle) trackTitle.textContent = track.title;
            if (trackArtist) trackArtist.textContent = track.artist;
            
            // 更新音频源
            const audioPlayer = document.getElementById('audio-player');
            if (audioPlayer) audioPlayer.src = track.audio;
            
            // 更新专辑封面选中状态
            document.querySelectorAll('.album-item').forEach((item, index) => {
                if (config.vinyl.tracks[index].id === trackId) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            // 如果正在播放，重新播放新曲目
            if (isPlaying && audioPlayer) {
                audioPlayer.play();
            }
        }

        // 切换播放/暂停
        function togglePlay() {
            const audioPlayer = document.getElementById('audio-player');
            const playBtn = document.getElementById('play-btn');
            const vinylRecord = document.getElementById('vinyl-record');
            
            if (!currentTrack || !audioPlayer || !playBtn || !vinylRecord) return;
            
            if (isPlaying) {
                audioPlayer.pause();
                playBtn.classList.remove('playing');
                vinylRecord.classList.remove('playing');
            } else {
                audioPlayer.play();
                playBtn.classList.add('playing');
                vinylRecord.classList.add('playing');
            }
            
            isPlaying = !isPlaying;
        }

        // 初始化合集区（Bento 布局）
        function initCollections() {
            if (!postsData.collections) return;
            
            const bentoGrid = document.getElementById('bento-grid');
            if (!bentoGrid) return;
            
            bentoGrid.innerHTML = '';
            
            postsData.collections.forEach(collection => {
                const bentoItem = document.createElement('div');
                bentoItem.className = `bento-item ${collection.size}`;
                
                const cover = document.createElement('img');
                cover.src = collection.cover;
                cover.alt = collection.title;
                cover.className = 'bento-cover';
                
                const overlay = document.createElement('div');
                overlay.className = 'bento-overlay';
                
                const title = document.createElement('h3');
                title.className = 'bento-title';
                title.textContent = collection.title;
                
                const description = document.createElement('p');
                description.className = 'bento-description';
                description.textContent = collection.description;
                
                overlay.appendChild(title);
                overlay.appendChild(description);
                bentoItem.appendChild(cover);
                bentoItem.appendChild(overlay);
                
                bentoItem.addEventListener('click', () => {
                    showCollectionPosts(collection.id);
                });
                
                bentoGrid.appendChild(bentoItem);
            });
        }

        // 显示合集文章
        function showCollectionPosts(collectionId) {
            const collection = postsData.collections.find(c => c.id === collectionId);
            if (!collection) return;
            
            const collectionPosts = postsData.posts.filter(post => post.collectionId === collectionId);
            
            // 临时替换时间流区域显示合集文章
            const timelineSection = document.getElementById('timeline');
            const timelineHeader = timelineSection.querySelector('.timeline-header');
            const timelineList = document.getElementById('timeline-list');
            
            timelineHeader.querySelector('h2').textContent = collection.title;
            timelineHeader.querySelector('.sort-controls').style.display = 'none';
            
            timelineList.innerHTML = '';
            
            if (collectionPosts.length === 0) {
                timelineList.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">该合集暂无文章</p>';
                return;
            }
            
            collectionPosts.forEach(post => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                
                const date = document.createElement('div');
                date.className = 'timeline-date';
                date.textContent = formatDate(post.date);
                
                const title = document.createElement('h3');
                title.className = 'timeline-title';
                title.textContent = post.title;
                
                const excerpt = document.createElement('p');
                excerpt.className = 'timeline-excerpt';
                excerpt.textContent = post.excerpt;
                
                timelineItem.appendChild(date);
                timelineItem.appendChild(title);
                timelineItem.appendChild(excerpt);
                
                timelineItem.addEventListener('click', () => {
                    showArticleDetail(post);
                });
                
                timelineList.appendChild(timelineItem);
            });
            
            // 滚动到时间流区域
            timelineSection.scrollIntoView({ behavior: 'smooth' });
            
            // 先移除所有已存在的返回按钮
            const existingBackBtns = timelineHeader.querySelectorAll('.sort-controls button');
            existingBackBtns.forEach(btn => {
                if (btn.textContent.includes('返回')) {
                    btn.remove();
                }
            });
            
            // 添加返回按钮
            const backBtn = document.createElement('button');
            backBtn.className = 'sort-btn';
            backBtn.textContent = '← 返回全部文章';
            backBtn.style.marginLeft = 'auto';
            backBtn.addEventListener('click', () => {
                initTimeline();
                timelineHeader.querySelector('.sort-controls').style.display = 'flex';
            });
            timelineHeader.querySelector('.sort-controls').style.display = 'flex';
            timelineHeader.querySelector('.sort-controls').appendChild(backBtn);
        }

        // 显示文章详情
        function showArticleDetail(post) {
            // 创建模态框显示文章详情
            const modal = document.createElement('div');
            modal.className = 'article-modal';
            
            modal.innerHTML = `
                <div class="modal-content">
                    <button class="modal-close">&times;</button>
                    <img src="${post.cover}" alt="${post.title}" class="modal-cover">
                    <h1 class="modal-title">${post.title}</h1>
                    <div class="modal-meta">
                        <span class="modal-date">${formatDate(post.date)}</span>
                        <div class="modal-tags">
                            ${post.tags.map(tag => `<span class="modal-tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="modal-body">${marked.parse(post.content)}</div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // 关闭按钮
            modal.querySelector('.modal-close').addEventListener('click', () => {
                document.body.removeChild(modal);
            });
            
            // 点击背景关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            });
            
            // 处理音频元素样式
            const audioElements = modal.querySelectorAll('audio');
            audioElements.forEach(audio => {
                audio.style.width = '100%';
                audio.style.margin = '1.5rem 0';
                audio.style.borderRadius = '8px';
            });
        }

        // 初始化时间流
        function initTimeline() {
            if (!postsData.posts) return;
            
            const timelineList = document.getElementById('timeline-list');
            if (!timelineList) return;
            
            // 重置标题
            const timelineHeader = document.querySelector('.timeline-header');
            timelineHeader.querySelector('h2').textContent = '文章时间流';
            
            // 移除返回按钮
            const backBtn = timelineHeader.querySelector('.sort-controls button:last-child');
            if (backBtn && backBtn.textContent.includes('返回')) {
                backBtn.remove();
            }
            
            renderTimeline();
            
            // 排序按钮事件
            const sortAscBtn = document.getElementById('sort-asc');
            const sortDescBtn = document.getElementById('sort-desc');
            
            if (sortAscBtn) {
                sortAscBtn.addEventListener('click', () => {
                    sortAscending = true;
                    updateSortButtons();
                    renderTimeline();
                });
            }
            
            if (sortDescBtn) {
                sortDescBtn.addEventListener('click', () => {
                    sortAscending = false;
                    updateSortButtons();
                    renderTimeline();
                });
            }
        }

        // 更新排序按钮状态
        function updateSortButtons() {
            const ascBtn = document.getElementById('sort-asc');
            const descBtn = document.getElementById('sort-desc');
            
            if (!ascBtn || !descBtn) return;
            
            if (sortAscending) {
                ascBtn.classList.add('active');
                descBtn.classList.remove('active');
            } else {
                ascBtn.classList.remove('active');
                descBtn.classList.add('active');
            }
        }

        // 渲染时间流
        function renderTimeline() {
            if (!postsData.posts) return;
            
            const timelineList = document.getElementById('timeline-list');
            if (!timelineList) return;
            
            timelineList.innerHTML = '';
            
            // 复制并排序文章
            const sortedPosts = [...postsData.posts].sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                return sortAscending ? dateA - dateB : dateB - dateA;
            });
            
            sortedPosts.forEach(post => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                
                const date = document.createElement('div');
                date.className = 'timeline-date';
                date.textContent = formatDate(post.date);
                
                const title = document.createElement('h3');
                title.className = 'timeline-title';
                title.textContent = post.title;
                
                const excerpt = document.createElement('p');
                excerpt.className = 'timeline-excerpt';
                excerpt.textContent = post.excerpt;
                
                timelineItem.appendChild(date);
                timelineItem.appendChild(title);
                timelineItem.appendChild(excerpt);
                
                timelineItem.addEventListener('click', () => {
                    showArticleDetail(post);
                });
                
                timelineList.appendChild(timelineItem);
            });
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // 显示专辑列表模态框
        function showAlbumsModal() {
            const modal = document.getElementById('albums-modal');
            const albumsGrid = document.getElementById('albums-modal-grid');
            
            if (!config.albums) return;
            
            albumsGrid.innerHTML = '';
            
            config.albums.forEach(album => {
                const albumCard = document.createElement('div');
                albumCard.className = 'albums-modal-card';
                
                const cover = document.createElement('img');
                cover.src = album.cover;
                cover.alt = album.title;
                cover.className = 'albums-modal-card-cover';
                
                const info = document.createElement('div');
                info.className = 'albums-modal-card-info';
                
                const title = document.createElement('h3');
                title.className = 'albums-modal-card-title';
                title.textContent = album.title;
                
                const artist = document.createElement('p');
                artist.className = 'albums-modal-card-artist';
                artist.textContent = album.artist;
                
                const year = document.createElement('p');
                year.className = 'albums-modal-card-year';
                year.textContent = album.year;
                
                const description = document.createElement('p');
                description.className = 'albums-modal-card-description';
                description.textContent = album.description;
                
                const tracks = document.createElement('div');
                tracks.className = 'albums-modal-card-tracks';
                
                album.tracks.forEach((track, index) => {
                    const trackElement = document.createElement('div');
                    trackElement.className = 'albums-modal-card-track';
                    trackElement.textContent = `${index + 1}. ${track}`;
                    tracks.appendChild(trackElement);
                });
                
                info.appendChild(title);
                info.appendChild(artist);
                info.appendChild(year);
                info.appendChild(description);
                info.appendChild(tracks);
                
                albumCard.appendChild(cover);
                albumCard.appendChild(info);
                
                albumsGrid.appendChild(albumCard);
            });
            
            modal.classList.add('active');
            
            // 模态框关闭事件
            const closeBtn = modal.querySelector('.albums-modal-close');
            closeBtn.onclick = () => {
                modal.classList.remove('active');
            };
            
            modal.onclick = (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            };
        }

        // 处理 hash 滚动
        function handleHashScroll() {
            if (window.location.hash) {
                const targetId = window.location.hash.substring(1);
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    setTimeout(() => {
                        targetElement.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                }
            }
        }
    </script>
</body>
</html>
