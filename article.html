<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - JoJoCollection</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="article-page">
    <article class="article-container" id="article-container">
        <div class="article-header">
            <a href="index.html" id="back-link" class="back-btn">← 返回</a>
            <button id="theme-toggle" class="theme-toggle">
                <span class="theme-light">☀</span>
                <span class="theme-dark">☾</span>
            </button>
        </div>
        
        <div class="article-content">
            <img id="article-cover" src="" alt="Article Cover" class="article-cover">
            <h1 id="article-title" class="article-title"></h1>
            <div class="article-meta">
                <span id="article-date" class="article-date"></span>
                <div id="article-tags" class="article-tags"></div>
            </div>
            <div id="article-body" class="article-body"></div>
        </div>
    </article>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="article.js"></script>
</body>
</html>
