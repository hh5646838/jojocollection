<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 — Redirecting</title>
    <script>
        (function() {
            var id = new URLSearchParams(location.search).get('id');
            var dest = 'app.html#/article' + (id ? '?id=' + encodeURIComponent(id) : '');
            location.replace(dest);
        })();
    </script>
</head>
<body>
    <p>正在跳转到新版单页应用…</p>
    <p>如未自动跳转，请 <a id="link" href="app.html#/">点击这里</a>。</p>
    <script>
        (function() {
            var id = new URLSearchParams(location.search).get('id');
            var dest = 'app.html#/article' + (id ? '?id=' + encodeURIComponent(id) : '');
            document.getElementById('link').href = dest;
        })();
    </script>
</body>
</html>
